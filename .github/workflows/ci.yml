name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux and macOS: orch's supported platforms. Same checks on both, so they
  # are one matrix. The go-version input pins the latest patch of the minor in
  # go.mod's go directive, which is itself a lower bound kept at the Go release
  # that fixes the standard-library advisory govulncheck reports.
  unix:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt reported files that need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test -race ./...

  # Vulnerability scan, once rather than per OS. govulncheck is pinned to a
  # version so the scan is reproducible, and needs no local install (`go run`
  # keeps it out of the module's own dependencies, and setup-go's module cache
  # speeds up repeat runs). It fails the job on known vulnerabilities the code is
  # affected by.
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  # Windows is NOT a supported target: orch drives real Unix pseudo-terminals
  # (syscall.Kill/SIGWINCH, golang.org/x/sys/unix), so the module does not
  # compile on Windows and there is no interactive PTY support to test. This gate
  # asserts that honest state rather than pretending support exists: it passes
  # only while the Windows build fails, and fails the day the build succeeds so
  # the matrix and README get updated instead of silently drifting.
  windows:
    name: "windows (build gate: unsupported)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true

      - name: Windows is not a supported build target
        shell: bash
        run: |
          if go build ./... 2>build.err; then
            echo "::error::orch now builds on Windows; promote this job to a real build/test gate and update the README."
            exit 1
          fi
          echo "orch does not build on Windows, as expected for a Unix-only tool. Build output:"
          cat build.err
