# Dependency updates. Weekly, grouped into one PR per ecosystem to keep the
# noise down, and never auto-merged: a human reviews and merges.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    groups:
      go:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
